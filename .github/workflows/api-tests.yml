name: API tests

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Nightly full regression, targeting 03:00 Europe/Berlin — the team's local
    # small hours, not the CI's.
    #
    # Actions cron is ALWAYS UTC; there is no timezone setting. 01:00 UTC is
    # therefore 03:00 in Berlin during CEST and 02:00 during CET. A single cron
    # cannot hold a fixed local hour across a DST change, so the choice is which
    # half of the year to be right in — summer, here. Changing this to follow DST
    # means editing the number twice a year, which is worse than an hour of drift
    # on a nightly job.
    #
    # It is also a lower bound, never an appointment. Scheduled workflows queue,
    # and the runs previously set for 03:00 UTC actually began at 04:05, 04:08 and
    # 04:17 UTC — a 65–77 minute delay, which is what made the nightly appear to
    # run at ~06:15 Berlin. Expect this one to start nearer 04:00 Berlin than
    # 03:00; :00 is the most contended slot on the platform. Move it to :23 or
    # :37 if that delay ever matters.
    - cron: '0 1 * * *'
  workflow_dispatch:

# A second run against the same GitHub accounts would fight over shared state
# (starred lists, the user's gist list) and burn rate-limit budget twice.
concurrency:
  group: api-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GIST_TOKEN_A: ${{ secrets.GIST_TOKEN_A }}
      GIST_TOKEN_B: ${{ secrets.GIST_TOKEN_B }}
      GIST_USERNAME_A: ${{ vars.GIST_USERNAME_A }}
      GIST_USERNAME_B: ${{ vars.GIST_USERNAME_B }}

    steps:
      - uses: actions/checkout@v7

      # node-version-file rather than a literal: .nvmrc is the single source of
      # truth, so local and CI cannot drift apart silently. Bumping Node is then
      # one edit in one file.
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      # Allure history turns a series of runs into trends: pass-rate over time,
      # retry counts, and which tests flake. Without it every report is an island,
      # and the exit criterion in docs/test-strategy.md — "flake rate below 2%
      # over 10 consecutive nightly runs" — cannot be evidenced at all.
      #
      # The cache key is unique per run with a shared prefix, because GitHub cache
      # entries are immutable: a fixed key would be written once and never updated.
      # restore-keys falls back to the most recent entry with that prefix.
      - name: Restore Allure history
        uses: actions/cache/restore@v6
        with:
          path: allure-history.jsonl
          key: allure-history-${{ github.run_id }}
          restore-keys: allure-history-

      # PR gate: P0 only, fast enough to sit in front of a merge.
      - name: Smoke
        if: github.event_name == 'pull_request'
        run: npm run test:smoke

      # Everything else runs the full regression suite.
      - name: Full regression
        if: github.event_name != 'pull_request'
        run: npm test

      # Teardown covers the normal path; this covers a killed runner.
      - name: Clean up leaked test data
        if: always()
        run: npm run cleanup -- --apply --older-than 0
        continue-on-error: true

      # Generated even when tests fail — a red run is exactly when the report matters.
      # Reads the restored history and appends this run to it.
      - name: Generate Allure report
        if: always()
        run: npm run allure:ci

      # One ~92 KB JSONL line per run, so it needs a ceiling or it grows forever.
      # 50 runs is well past the 10 the flake-rate criterion asks for.
      - name: Trim Allure history
        if: always()
        run: tail -n 50 allure-history.jsonl > history.tmp && mv history.tmp allure-history.jsonl

      # Saved only from main and the nightly schedule. PR branches read history but
      # do not write it, so a feature branch cannot poison the trend line that the
      # flake-rate criterion is measured against.
      - name: Save Allure history
        if: always() && github.event_name != 'pull_request'
        uses: actions/cache/save@v6
        with:
          path: allure-history.jsonl
          key: allure-history-${{ github.run_id }}

      - uses: actions/upload-artifact@v7
        id: allure_artifact
        if: always()
        with:
          name: allure-report
          path: allure-report/
          retention-days: 14

      - uses: actions/upload-artifact@v7
        id: playwright_artifact
        if: always()
        with:
          name: playwright-report
          path: |
            playwright-report/
            results.xml
          retention-days: 14

      # Last, because it links to the artifacts uploaded above. An artifact URL
      # only downloads a zip, so the headline numbers are rendered inline here —
      # otherwise a red run tells you nothing until you unpack something.
      - name: Write run summary
        if: always()
        env:
          SUITE: ${{ github.event_name == 'pull_request' && 'smoke' || 'full regression' }}
          ALLURE_ARTIFACT_URL: ${{ steps.allure_artifact.outputs.artifact-url }}
          PLAYWRIGHT_ARTIFACT_URL: ${{ steps.playwright_artifact.outputs.artifact-url }}
        run: npx tsx scripts/job-summary.ts