name: API tests

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Nightly full regression at 03:00 UTC.
    - cron: '0 3 * * *'
  workflow_dispatch:

# A second run against the same GitHub accounts would fight over shared state
# (starred lists, the user's gist list) and burn rate-limit budget twice.
concurrency:
  group: api-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GIST_TOKEN_A: ${{ secrets.GIST_TOKEN_A }}
      GIST_TOKEN_B: ${{ secrets.GIST_TOKEN_B }}
      GIST_USERNAME_A: ${{ vars.GIST_USERNAME_A }}
      GIST_USERNAME_B: ${{ vars.GIST_USERNAME_B }}

    steps:
      - uses: actions/checkout@v7

      # node-version-file rather than a literal: .nvmrc is the single source of
      # truth, so local and CI cannot drift apart silently. Bumping Node is then
      # one edit in one file.
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      # Allure history turns a series of runs into trends: pass-rate over time,
      # retry counts, and which tests flake. Without it every report is an island,
      # and the exit criterion in docs/test-strategy.md — "flake rate below 2%
      # over 10 consecutive nightly runs" — cannot be evidenced at all.
      #
      # The cache key is unique per run with a shared prefix, because GitHub cache
      # entries are immutable: a fixed key would be written once and never updated.
      # restore-keys falls back to the most recent entry with that prefix.
      - name: Restore Allure history
        uses: actions/cache/restore@v6
        with:
          path: allure-history.jsonl
          key: allure-history-${{ github.run_id }}
          restore-keys: allure-history-

      # PR gate: P0 only, fast enough to sit in front of a merge.
      - name: Smoke
        if: github.event_name == 'pull_request'
        run: npm run test:smoke

      # Everything else runs the full regression suite.
      - name: Full regression
        if: github.event_name != 'pull_request'
        run: npm test

      # Teardown covers the normal path; this covers a killed runner.
      - name: Clean up leaked test data
        if: always()
        run: npm run cleanup -- --apply --older-than 0
        continue-on-error: true

      # Generated even when tests fail — a red run is exactly when the report matters.
      # Reads the restored history and appends this run to it.
      - name: Generate Allure report
        if: always()
        run: npm run allure:ci

      # One ~92 KB JSONL line per run, so it needs a ceiling or it grows forever.
      # 50 runs is well past the 10 the flake-rate criterion asks for.
      - name: Trim Allure history
        if: always()
        run: tail -n 50 allure-history.jsonl > history.tmp && mv history.tmp allure-history.jsonl

      # Saved only from main and the nightly schedule. PR branches read history but
      # do not write it, so a feature branch cannot poison the trend line that the
      # flake-rate criterion is measured against.
      - name: Save Allure history
        if: always() && github.event_name != 'pull_request'
        uses: actions/cache/save@v6
        with:
          path: allure-history.jsonl
          key: allure-history-${{ github.run_id }}

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: allure-report
          path: allure-report/
          retention-days: 14

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report
          path: |
            playwright-report/
            results.xml
          retention-days: 14